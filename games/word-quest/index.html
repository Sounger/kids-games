<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #245a32; }
    body { font-family: "Fredoka", system-ui, sans-serif; color: #fff; user-select: none; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; image-rendering: pixelated; cursor: pointer; }
    .hidden { display: none !important; }
    .pixel { font-family: "Press Start 2P", monospace; }

    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3vh; text-align: center; background: rgba(20, 16, 40, 0.6); padding: 16px; z-index: 10;
    }
    .logo {
      font-family: "Press Start 2P", monospace; font-size: clamp(32px, 7vw, 110px); line-height: 1.15;
      color: #ffd23f; text-shadow: 0 6px 0 #b45309, 0 12px 0 #2b2140;
    }
    .logo small { display: block; font-size: 0.35em; color: #fff; text-shadow: 0 4px 0 #2b2140; margin-top: 2vh; }
    .big-btn {
      font: inherit; font-size: clamp(28px, 4vw, 56px); font-weight: 700; cursor: pointer;
      min-height: 80px; padding: 12px 48px; border: 5px solid #2b2140; border-radius: 22px;
      background: #ffd23f; color: #2b2140; box-shadow: 0 8px 0 #2b2140;
    }
    .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #2b2140; }
    .small-btn {
      font: inherit; font-size: clamp(18px, 2vw, 26px); font-weight: 700; cursor: pointer; min-height: 64px; padding: 8px 24px;
      border: 4px solid #2b2140; border-radius: 18px; background: rgba(255, 255, 255, 0.9); color: #2b2140;
    }
    .press { font-size: clamp(22px, 3vw, 40px); font-weight: 700; animation: blink 1s steps(2) infinite; }
    .press b { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: #e94b5b; border: 4px solid #2b2140; }

    .pad-chip {
      display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.45); font-size: clamp(16px, 1.8vw, 24px); font-weight: 500; color: #d6d3e0;
    }
    .pad-chip .dot { width: 14px; height: 14px; border-radius: 50%; background: #9ca3af; }
    .pad-chip.on { color: #fff; }
    .pad-chip.on .dot { background: #4ade80; box-shadow: 0 0 10px #4ade80; }

    .hud { position: fixed; top: 12px; right: 12px; display: flex; gap: 10px; align-items: center; z-index: 20; }
    .hud .pad-chip { opacity: 0.85; }
    body:not([data-state="title"]) .hud .pad-chip:not(.on) { display: none; }
    .icon-btn {
      width: 56px; height: 56px; border-radius: 16px; border: 3px solid #2b2140; background: rgba(255, 255, 255, 0.85);
      font-size: 28px; cursor: pointer; display: grid; place-items: center; color: #2b2140;
    }

    /* Word bar (top) and slots (bottom), shown while playing */
    .wordbar, .slots { display: none; }
    body[data-state="play"] .wordbar, body[data-state="paused"] .wordbar, body[data-state="celebrate"] .wordbar,
    body[data-state="play"] .slots, body[data-state="paused"] .slots, body[data-state="celebrate"] .slots,
    body[data-state="chest"] .wordbar, body[data-state="chest"] .slots { display: flex; }
    .wordbar {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      align-items: center; gap: 0.5em; padding: 0.3em 0.7em; border-radius: 24px;
      background: rgba(20, 16, 40, 0.55); font-size: clamp(30px, 5vw, 80px);
    }
    .wordbar .pic { font-size: 1.1em; line-height: 1; }
    .wordbar .w { font-family: "Press Start 2P", monospace; letter-spacing: 0.15em; color: #fff; text-shadow: 0 5px 0 #2b2140; }
    .slots {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5;
      gap: clamp(8px, 1.2vw, 18px); padding: 12px 18px; border-radius: 24px; background: rgba(20, 16, 40, 0.45);
    }
    .slot {
      width: clamp(40px, 12vw, 128px); height: clamp(52px, 14vw, 140px); display: grid; place-items: center;
      font-family: "Press Start 2P", monospace; font-size: clamp(24px, 5.5vw, 84px); color: #fff;
      border-bottom: 8px solid #fff; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
    }
    .slot.filled { border-bottom-color: #ffd23f; background: rgba(255, 255, 255, 0.92); animation: pop 0.45s; }
    .flyer {
      position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none;
      font-family: "Press Start 2P", monospace; font-size: clamp(36px, 5.5vw, 84px);
    }

    /* Word and victory screens */
    .bigpic { font-size: clamp(110px, 22vh, 260px); line-height: 1; animation: pop 0.6s; filter: drop-shadow(0 10px 0 rgba(0,0,0,.3)); }
    .bigword { font-family: "Press Start 2P", monospace; font-size: clamp(44px, 9vw, 150px); letter-spacing: 0.12em; color: #fff; text-shadow: 0 8px 0 #2b2140; }
    .stars { font-size: clamp(50px, 10vh, 110px); letter-spacing: 0.15em; }
    .stars span { display: inline-block; animation: pop 0.5s backwards; }
    .say-btn {
      font-size: 0.55em; width: 1.6em; height: 1.6em; min-width: 64px; min-height: 64px; border-radius: 50%; cursor: pointer;
      border: 4px solid #2b2140; background: #fff; display: grid; place-items: center; padding: 0; line-height: 1;
    }
    .say-btn:active { transform: scale(0.92); }
    #show .say-btn { font-size: clamp(30px, 4vw, 52px); }
    .bigword span { display: inline-block; transition: transform 0.15s, color 0.15s; }
    .bigword span.lit { color: #ffd23f; transform: translateY(-0.15em) scale(1.25); }
    .sound-hint { font-size: clamp(18px, 2vw, 26px); background: rgba(0,0,0,.45); padding: 8px 18px; border-radius: 999px; }
    .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }

    /* Chest window */
    #math { background: rgba(20, 16, 40, 0.35); }
    .math-card {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 4vh;
      padding: 4vh 5vw; border-radius: 32px; background: #fff8ec; color: #2b2140;
      border: 6px solid #2b2140; box-shadow: 0 12px 0 #2b2140;
    }
    .math-card .chest-pic { font-size: clamp(50px, 8vh, 90px); line-height: 1; }
    .math-text { font-family: "Press Start 2P", monospace; font-size: clamp(40px, 7vw, 110px); }
    .answers { display: flex; gap: 3vw; }
    .answer {
      font-family: "Press Start 2P", monospace; font-size: clamp(36px, 5.5vw, 84px); cursor: pointer;
      min-width: clamp(84px, 14vw, 220px); min-height: clamp(84px, 14vh, 170px); border-radius: 26px;
      border: 6px solid #2b2140; background: #93c5fd; color: #2b2140; box-shadow: 0 8px 0 #2b2140;
      transition: transform 0.12s, opacity 0.3s, background 0.2s;
    }
    .answer.selected { background: #ffd23f; transform: scale(1.15); box-shadow: 0 8px 0 #2b2140, 0 0 0 10px #fff, 0 0 0 16px #ff5a5f; }
    .answer.gone { opacity: 0; transform: scale(0.3); pointer-events: none; width: 0; min-width: 0; padding: 0; margin: 0 -1.5vw; border-width: 0; }
    .answer.right { background: #4ade80; transform: scale(1.2); }
    .math-close { position: absolute; top: -26px; right: -26px; width: 64px; height: 64px; border-radius: 50%; border: 4px solid #2b2140; background: #fff; font-size: 30px; cursor: pointer; }
    .shake { animation: shake 0.45s; }
    @keyframes shake { 20%, 60% { transform: translateX(-16px) rotate(-2deg); } 40%, 80% { transform: translateX(16px) rotate(2deg); } }

    /* Thought bubble over the hero after a decoy: the letters still needed */
    .bubble {
      position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none;
      display: flex; gap: 0.35em; align-items: center; padding: 0.35em 0.6em; border-radius: 26px;
      background: #fff; border: 5px solid #2b2140; color: #2b2140;
      font-family: "Press Start 2P", monospace; font-size: clamp(24px, 3vw, 46px); animation: pop 0.35s;
    }
    .bubble::after, .bubble::before {
      content: ""; position: absolute; border-radius: 50%; background: #fff; border: 4px solid #2b2140;
    }
    .bubble::after { width: 18px; height: 18px; bottom: -30px; left: 50%; }
    .bubble::before { width: 10px; height: 10px; bottom: -48px; left: calc(50% - 10px); }
    .bubble .no { color: #9aa0a6; text-decoration: line-through; text-decoration-thickness: 5px; margin-right: 0.3em; }

    .pic-img { height: 1em; width: auto; vertical-align: middle; image-rendering: auto; border-radius: 0.08em; }

    /* ⚙️ hold-to-open button */
    .gear { position: relative; overflow: hidden; }
    .gear::after { content: ""; position: absolute; inset: 0; background: #ffd23f; transform: scaleX(0); transform-origin: left; z-index: -1; }
    .gear.holding::after { transform: scaleX(1); transition: transform 3s linear; }
    .gear { isolation: isolate; }
    .gear-tip { position: absolute; top: 64px; right: 0; white-space: nowrap; background: #2b2140; color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 16px; }

    /* "Choose a word" screen */
    .pick-grid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 1400px; max-height: 70vh; overflow: auto; padding: 16px; }
    .pick-card {
      display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font: inherit;
      min-width: 170px; padding: 14px 18px; border-radius: 22px; border: 5px solid #2b2140; background: #fff8ec; color: #2b2140; box-shadow: 0 6px 0 #2b2140;
    }
    .pick-card .pic { font-size: 64px; line-height: 1; }
    .pick-card .w { font-family: "Press Start 2P", monospace; font-size: 22px; }
    .pick-card.selected { background: #ffd23f; transform: scale(1.08); box-shadow: 0 6px 0 #2b2140, 0 0 0 8px #fff, 0 0 0 13px #ff5a5f; }

    /* Teacher menu */
    .teacher { background: rgba(20, 16, 40, 0.75); z-index: 50; justify-content: center; }
    .t-ask { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(43, 33, 64, 0.55); }
    .t-ask-box { max-width: 520px; margin: 16px; padding: 22px 26px; border-radius: 20px; background: #fff8ec; border: 4px solid #2b2140; box-shadow: 0 8px 0 #2b2140; font-size: 20px; white-space: pre-line; }
    .t-ask-box p { margin: 0 0 16px; }
    .t-panel {
      position: relative;
      width: min(980px, 100%); max-height: 94vh; display: flex; flex-direction: column; text-align: left;
      background: #fff8ec; color: #2b2140; border: 5px solid #2b2140; border-radius: 24px; overflow: hidden; font-size: 18px; user-select: text;
    }
    .t-panel header, .t-panel footer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #f1e3c8; }
    .t-panel header h2 { margin: 0 12px 0 0; font-size: 24px; }
    .t-panel header .sp { flex: 1; }
    .t-panel button, .t-panel select, .t-panel input:not([type=checkbox]):not([type=range]) {
      font: inherit; font-size: 17px; min-height: 42px; padding: 6px 12px; border-radius: 12px; border: 2px solid #2b2140; background: #fff; color: #2b2140;
    }
    .t-panel button { cursor: pointer; font-weight: 600; }
    .t-panel button:disabled { opacity: 0.35; cursor: default; }
    .t-panel button.on, .t-primary { background: #ffd23f !important; }
    .t-body { overflow: auto; padding: 8px 18px 18px; flex: 1; }
    .t-label { font-weight: 700; font-size: 20px; margin: 18px 0 8px; }
    .t-note { color: #7a6f8c; font-size: 15px; font-weight: 400; }
    .t-chips, .t-line { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
    .t-line label { display: flex; gap: 8px; align-items: center; }
    .t-chip small { color: #7a6f8c; }
    .t-list { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; max-height: 34vh; overflow: auto; }
    .t-row { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 12px; background: #fff; border: 2px solid #eadfcc; }
    .t-row.editing { border-color: #ffd23f; background: #fff7cf; }
    .t-row .t-word { flex: 1; font-family: "Press Start 2P", monospace; font-size: 16px; }
    .t-row button { min-height: 36px !important; padding: 2px 10px !important; }
    .t-pic { width: 46px; text-align: center; font-size: 32px; }
    .t-pic.big { width: auto; min-width: 60px; font-size: 48px; }
    .t-form { border-top: 2px dashed #d8c9ad; padding-top: 4px; }
    .t-error { color: #c2410c; font-weight: 600; }
    .t-set { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 6px 0; border-bottom: 1px solid #eadfcc; }
    .t-set > span { flex: 1; }
    .t-set input[type=range] { width: 220px; }
    .t-toggle input { display: none; }
    .t-toggle span { display: inline-block; width: 56px; height: 30px; border-radius: 99px; background: #cbd5e1; position: relative; cursor: pointer; transition: background .2s; }
    .t-toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
    .t-toggle input:checked + span { background: #22c55e; }
    .t-toggle input:checked + span::after { left: 29px; }
    kbd { border: 2px solid #2b2140; border-radius: 6px; padding: 0 5px; background: #fff; }

    .player-chip {
      position: fixed; top: 12px; left: 12px; z-index: 6; display: none; align-items: center; gap: 8px; padding: 4px 16px 4px 8px; border-radius: 999px;
      background: rgba(20, 16, 40, 0.6); font-size: clamp(20px, 2.4vw, 34px); font-weight: 700;
    }
    .player-chip .av { font-size: 1.3em; }
    body[data-state="play"] .player-chip.on, body[data-state="paused"] .player-chip.on, body[data-state="chest"] .player-chip.on, body[data-state="celebrate"] .player-chip.on { display: flex; }
    .pick-card .stars-small { font-size: 18px; color: #7a6f8c; font-family: "Fredoka", sans-serif; font-weight: 700; }
    .new-player { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 28px 36px; border-radius: 28px; background: #fff8ec; color: #2b2140; border: 5px solid #2b2140; box-shadow: 0 10px 0 #2b2140; }
    .new-player input { font: inherit; font-size: clamp(28px, 4vw, 48px); font-weight: 700; text-align: center; width: min(80vw, 520px); padding: 10px 16px; border-radius: 18px; border: 4px solid #2b2140; user-select: text; }
    .avatars { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 620px; }
    .avatars button { font-size: 42px; width: 72px; height: 72px; border-radius: 18px; border: 4px solid #d8c9ad; background: #fff; cursor: pointer; }
    .avatars button.on { border-color: #2b2140; background: #ffd23f; transform: scale(1.1); }
    .np-error { color: #c2410c; font-weight: 700; min-height: 1.2em; }
    .win-player { font-size: clamp(28px, 4vw, 52px); font-weight: 700; }
    .bonus-chip {
      position: fixed; top: 76px; left: 12px; z-index: 6; padding: 6px 18px; border-radius: 999px;
      background: rgba(20, 16, 40, 0.6); font-family: "Press Start 2P", monospace; font-size: clamp(22px, 2.6vw, 40px); color: #a5f3fc;
    }
    .win-bonus { font-family: "Press Start 2P", monospace; font-size: clamp(26px, 4vw, 54px); color: #a5f3fc; text-shadow: 0 5px 0 #2b2140; }

    .confetti { position: fixed; top: -50px; font-size: clamp(30px, 4vw, 54px); pointer-events: none; z-index: 40; animation: fall linear forwards; }

    @keyframes blink { 50% { opacity: 0.35; } }
    @keyframes pop { 0% { transform: scale(0.3); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    @keyframes fall { to { transform: translateY(115vh) rotate(600deg); } }
  </style>
</head>
<body data-state="title">
  <canvas id="game" aria-label="Word Quest map"></canvas>

  <div class="wordbar"><span class="pic" id="barPic"></span><span class="w" id="barWord"></span><button class="say-btn" id="sayBtn" title="Say the word">🔊</button></div>
  <div class="slots" id="slots"></div>
  <div class="bubble hidden" id="bubble"></div>
  <div class="player-chip" id="playerChip"><span class="av" id="chipAvatar"></span><span id="chipName"></span></div>
  <div class="bonus-chip hidden" id="bonusChip">💎 <span id="bonusNum">0</span></div>

  <div class="hud">
    <span class="pad-chip"><span class="dot"></span><span class="txt">Gamepad</span></span>
    <div style="position:relative"><button class="icon-btn gear" id="gearBtn" title="Teacher menu: hold 3 seconds">⚙️</button><span class="gear-tip hidden" id="gearTip">Teacher: hold for 3 seconds</span></div>
    <button class="icon-btn" id="musicBtn" title="Music on/off">🎵</button>
    <button class="icon-btn" id="sfxBtn" title="Sound effects on/off">🔔</button>
    <button class="icon-btn" id="fsBtn" title="Full screen (F)">⛶</button>
  </div>

  <section class="overlay" id="title">
    <div class="logo">WORD<br>QUEST<small>🗺️ Find the letters!</small></div>
    <button class="big-btn" id="playBtn">▶ PLAY</button>
    <div class="press">Press <b>A</b> to start</div>
    <span class="pad-chip"><span class="dot"></span><span class="txt">Gamepad</span></span>
    <span class="sound-hint" id="soundHint">🔈 Click or press a key once to turn on the sound</span>
  </section>

  <section class="overlay hidden" id="show">
    <div class="bigpic" id="showPic"></div>
    <div class="row"><div class="bigword" id="showWord"></div><button class="say-btn" id="showSayBtn" title="Say the word again">🔊</button></div>
    <button class="big-btn" id="goBtn">▶ GO!</button>
    <div class="press">Press <b>A</b></div>
  </section>

  <section class="overlay hidden" id="pause">
    <div class="logo">PAUSE</div>
    <button class="big-btn" id="resumeBtn">▶ GO ON</button>
  </section>

  <section class="overlay hidden" id="math">
    <div class="math-card" id="mathCard">
      <button class="math-close" id="mathClose" title="Close (B)">✖</button>
      <div class="chest-pic">🧰</div>
      <div class="math-text" id="mathText"></div>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <section class="overlay hidden" id="who">
    <div class="logo" style="font-size:clamp(26px,4vw,60px)">WHO IS PLAYING?</div>
    <div class="pick-grid" id="whoGrid"></div>
  </section>

  <section class="overlay hidden" id="newPlayer">
    <div class="new-player">
      <div class="logo" style="font-size:clamp(22px,3vw,44px);text-shadow:0 4px 0 #b45309">NEW PLAYER</div>
      <input id="npName" maxlength="14" placeholder="Name" autocomplete="off" spellcheck="false">
      <div class="avatars" id="npAvatars"></div>
      <div class="np-error" id="npError"></div>
      <div class="row">
        <button class="big-btn" id="npSave">✔ OK</button>
        <button class="small-btn" id="npCancel">Back</button>
      </div>
    </div>
  </section>

  <section class="overlay hidden" id="pick">
    <div class="logo" style="font-size:clamp(26px,4vw,60px)">CHOOSE A WORD</div>
    <div class="pick-grid" id="pickGrid"></div>
  </section>

  <section class="overlay hidden teacher" id="teacher">
    <div class="t-panel">
      <header>
        <h2>⚙️ Teacher menu</h2>
        <button id="tTabWords">📚 Words</button>
        <button id="tTabSettings">🎛️ Settings</button>
        <button id="tTabPlayers">👥 Players</button>
        <span class="sp"></span>
        <button id="tClose" title="Close">✖</button>
      </header>
      <div class="t-body" id="tBody"></div>
      <footer>
        <button id="tExport" title="Save words and settings to a file">⬇️ Export to file</button>
        <button id="tImport" title="Load words and settings from a file">⬆️ Import from file</button>
        <input type="file" id="tImportFile" accept=".json,application/json" hidden>
        <button id="tReset">↺ Reset</button>
        <span class="sp" style="flex:1"></span>
        <button id="tNewWord" title="Leave this word and start a new one">▶ New word now</button>
        <button class="t-primary" id="tDone">✔ Done</button>
      </footer>
      <div class="t-ask hidden" id="tAsk">
        <div class="t-ask-box">
          <p id="tAskText"></p>
          <div class="t-line"><button class="t-primary" id="tAskYes">Yes</button><button id="tAskNo">Cancel</button></div>
        </div>
      </div>
    </div>
  </section>

  <section class="overlay hidden" id="win">
    <div class="logo">GREAT JOB!</div>
    <div class="stars"><span>⭐</span><span style="animation-delay:.2s">⭐</span><span style="animation-delay:.4s">⭐</span></div>
    <div class="row"><div class="bigpic" id="winPic"></div><div class="bigword" id="winWord"></div></div>
    <div class="win-player hidden" id="winPlayer"></div>
    <div class="win-bonus hidden" id="winBonus">+ 💎 × <span id="winBonusNum">0</span></div>
    <div class="row">
      <button class="big-btn" id="nextBtn">▶ PLAY AGAIN</button>
      <button class="small-btn" id="sameBtn" title="Play the same word again">🔁 Same word</button>
      <button class="small-btn" id="otherPlayerBtn" title="Someone else plays now">👥 Next player</button>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
