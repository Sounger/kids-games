<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Typer Kids</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
      body {
        font-family: 'Nunito', sans-serif;
      }
      /* Custom bounce animation for success */
      @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .pop-in {
        animation: popIn 0.3s ease-out forwards;
      }
      .shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
      /* 3D Spin animation for bonus */
      @keyframes spin-y {
        0% { transform: perspective(400px) rotateY(0deg); }
        100% { transform: perspective(400px) rotateY(360deg); }
      }
      .animate-spin-y {
        animation: spin-y 3s linear infinite;
      }
    </style>
</head>
  <body class="bg-gradient-to-br from-indigo-400 via-purple-400 to-pink-400 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
